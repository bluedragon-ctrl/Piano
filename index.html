<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="top">
      <div class="toolbar">
        <label for="song">Song</label>
        <select id="song">
          <option value="">Free play</option>
        </select>
        <button id="restart" type="button" hidden>Restart</button>
        <span id="progress" aria-live="polite"></span>
        <button id="fullscreen" type="button">Full screen</button>
        <label class="setting">Volume
          <input id="volume" type="range" min="0" max="100" value="80" />
        </label>
        <label class="setting">
          <input id="labels" type="checkbox" checked />
          Note names
        </label>
      </div>
      <h1>Piano</h1>
      <p id="status"></p>
      <p id="sound-status" class="note"></p>
      <p id="rotate-hint">Rotate your device for bigger keys</p>
      </div>
      <div id="piano" aria-label="Piano keyboard"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
